<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr.B OSs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;font-size:14px;color:var(--txt);background:#000;user-select:none}
input,textarea,[contenteditable]{user-select:text}
:root{--acc:#0067c0;--bg:#f3f3f3;--card:#fff;--card2:#fbfbfb;--txt:#1b1b1b;--txt2:#616161;--stroke:rgba(0,0,0,.09);--surface:rgba(243,243,243,.88);--hover:rgba(0,0,0,.05);--wbg:#fff;--wbg2:#f9f9f9}
body.dark{--bg:#202020;--card:#2b2b2b;--card2:#262626;--txt:#f1f1f1;--txt2:#a8a8a8;--stroke:rgba(255,255,255,.09);--surface:rgba(36,36,36,.88);--hover:rgba(255,255,255,.06);--wbg:#272727;--wbg2:#232323}
body.hc{--acc:#ffff00;--card:#000;--card2:#111;--txt:#fff;--txt2:#ddd;--stroke:#fff;--surface:rgba(0,0,0,.92);--hover:rgba(255,255,255,.18);--wbg:#000;--wbg2:#0a0a0a}
body.rm *{animation:none!important;transition:none!important}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border:3px solid transparent;background-clip:content-box;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.ico{width:20px;height:20px;display:inline-flex;flex:none}.ico svg{width:100%;height:100%}
#screen{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background-size:cover;background-position:center}
#dicons{position:absolute;inset:8px 8px 60px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px}
.dico{width:86px;height:92px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-top:6px;cursor:default}
.dico:hover{background:rgba(255,255,255,.12);outline:1px solid rgba(255,255,255,.2)}
.dico.sel{background:rgba(255,255,255,.25);outline:1px solid rgba(255,255,255,.4)}
.dico .ico{width:42px;height:42px}.dico img{width:44px;height:42px;object-fit:cover;border-radius:4px}
.dico span{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;max-width:82px;max-height:30px;overflow:hidden;line-height:1.2}
#winlayer{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--wbg);border:1px solid var(--stroke);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);overflow:hidden;min-width:320px;min-height:220px;animation:wop .16s ease-out}
.win.focused{box-shadow:0 22px 60px rgba(0,0,0,.35)}
@keyframes wop{from{transform:scale(.94);opacity:0}}
.win.closing{transition:.13s;transform:scale(.94);opacity:0}
.win.mn{transition:.18s;transform:scale(.8) translateY(40vh);opacity:0;pointer-events:none}
.win.maxed{border-radius:0;border:none}
.cap{height:36px;display:flex;align-items:center;background:var(--wbg2);border-bottom:1px solid var(--stroke);flex:none}
.cap-ico{width:16px;height:16px;margin:0 8px 0 12px}.cap-ico svg{width:100%;height:100%}
.cap-t{font-size:12px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:8px}
.capbtn{width:46px;height:36px;display:flex;align-items:center;justify-content:center}
.capbtn .ico{width:14px;height:14px}
.capbtn:hover{background:var(--hover)}.capbtn.close:hover{background:#c42b1c;color:#fff}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--wbg)}
.rz-e{position:absolute;right:0;top:0;width:6px;height:100%;cursor:ew-resize;z-index:5}
.rz-s{position:absolute;bottom:0;left:0;height:6px;width:100%;cursor:ns-resize;z-index:5}
.rz-se{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;z-index:5}
#snapPrev{position:absolute;background:rgba(255,255,255,.25);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.5);border-radius:8px;z-index:40;display:none;pointer-events:none;transition:all .12s}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--surface);backdrop-filter:blur(28px) saturate(1.4);border-top:1px solid var(--stroke);display:flex;align-items:center;z-index:60}
#tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:100%}
.tb-b{width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative}
.tb-b:hover{background:var(--hover)}.tb-b .ico{width:24px;height:24px}
.tb-b.run::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:3px;background:var(--acc)}
.tb-b.act::after{width:16px}
#tb-search{width:auto;padding:0 12px;gap:8px;height:34px;border-radius:17px;background:var(--card);border:1px solid var(--stroke);color:var(--txt2);font-size:13px}
#tb-tray{margin-left:auto;display:flex;align-items:center;padding-right:8px;height:100%}
.tray-g{display:flex;align-items:center;gap:6px;padding:0 8px;height:38px;border-radius:5px}
.tray-g:hover{background:var(--hover)}.tray-g .ico{width:17px;height:17px}
#tb-clock{flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.25;color:var(--txt)}
.panel{position:absolute;background:var(--surface);backdrop-filter:blur(34px) saturate(1.4);border:1px solid var(--stroke);border-radius:9px;box-shadow:0 18px 50px rgba(0,0,0,.32);z-index:70;display:none;flex-direction:column}
.panel.open{display:flex;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
#startmenu{width:594px;height:min(660px,calc(100vh - 70px));left:50%;transform:translateX(-50%);bottom:58px;padding:24px 0 0}
#startmenu.open{animation:popU .18s ease-out}
@keyframes popU{from{transform:translateX(-50%) translateY(20px);opacity:0}}
.st-search{margin:0 40px 18px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--stroke);border-bottom:2px solid var(--acc);border-radius:16px;padding:7px 14px}
.st-search input{flex:1;border:none;outline:none;background:none;font:inherit;color:var(--txt)}
.st-body{flex:1;overflow-y:auto;padding:0 40px}
.st-lbl{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-size:13px;font-weight:600}
.st-lbl button{font-size:12px;background:var(--card);border:1px solid var(--stroke);padding:3px 12px;border-radius:4px}
.st-grid{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:18px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:5px}
.st-app:hover{background:var(--hover)}.st-app .ico{width:32px;height:32px}
.st-app span{font-size:11.5px;max-width:80px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st-all .st-app{flex-direction:row;gap:14px;padding:8px 12px;text-align:left}
.st-all .st-app .ico{width:26px;height:26px}.st-all .st-app span{font-size:13.5px}
.st-rec{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:10px}
.st-rc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;text-align:left}
.st-rc:hover{background:var(--hover)}.st-rc .ico{width:28px;height:28px}
.st-rc small{color:var(--txt2)}
.st-foot{height:60px;flex:none;background:var(--hover);border-top:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-radius:0 0 9px 9px}
.st-user{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:5px;font-size:13px}.st-user:hover{background:var(--hover)}
.st-pw{width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center}.st-pw:hover{background:var(--hover)}
#qspanel{width:340px;right:10px;bottom:58px;padding:16px}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qs-t{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--stroke);border-radius:6px;padding:10px 12px;font-size:12.5px}
.qs-t.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.qs-sl{display:flex;align-items:center;gap:12px;margin:10px 0}.qs-sl .ico{width:19px;height:19px}
input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:var(--stroke);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--wbg);cursor:pointer}
#calpanel{width:320px;right:10px;bottom:58px;padding:16px}
.cal-d{font-size:24px;font-weight:600;margin:4px 0 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-g b{color:var(--txt2);font-weight:400;padding:4px 0}
.cal-g span{padding:7px 0;border-radius:50%}.cal-g span.today{background:var(--acc);color:#fff}
#ctxlayer{position:fixed;inset:0;z-index:200;pointer-events:none}
.ctx{position:absolute;min-width:190px;background:var(--surface);backdrop-filter:blur(30px);border:1px solid var(--stroke);border-radius:8px;padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.28);pointer-events:auto;animation:pop .1s}
.ctx-i{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:5px;font-size:13px;text-align:left}
.ctx-i:hover{background:var(--hover)}.ctx-i .ico{width:16px;height:16px}
.ctx-sep{height:1px;background:var(--stroke);margin:4px 8px}
#modall{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none;align-items:center;justify-content:center}
#modall.open{display:flex}
.modal{width:400px;background:var(--wbg);border:1px solid var(--stroke);border-radius:9px;padding:22px;animation:pop .14s}
.modal h3{font-size:17px;margin-bottom:14px}
.modal input,.modal select{width:100%;border:1px solid var(--stroke);border-bottom:2px solid var(--acc);border-radius:5px;padding:9px 12px;font:inherit;outline:none;background:var(--card);color:var(--txt);margin-bottom:6px}
.m-btns{display:flex;gap:9px;justify-content:flex-end}
.btn{padding:7px 22px;border-radius:5px;border:1px solid var(--stroke);background:var(--card);font-size:13.5px}.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.uac{width:440px;background:#1c1c1c;border:1px solid #444;border-radius:9px;overflow:hidden;color:#eee;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .14s}
.uac-h{background:#0b4a8f;display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:15px;font-weight:600;color:#fff}
.uac-b{padding:18px}
.uac-b p{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.uac input,.uac select{width:100%;padding:9px 12px;border-radius:5px;border:1px solid #555;background:#2b2b2b;color:#eee;font:inherit;outline:none;margin-bottom:10px}
.uac .m-btns{margin-top:6px}
#toasts{position:fixed;right:14px;bottom:62px;z-index:250;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);backdrop-filter:blur(28px);border:1px solid var(--stroke);border-radius:8px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;animation:tin .22s;max-width:340px}
.toast .ico{width:22px;height:22px;color:var(--acc)}
.toast.out{transition:.3s;transform:translateX(30px);opacity:0}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.tbar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--stroke);background:var(--wbg2);flex:none}
.tbar .tb{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.tbar .tb:hover{background:var(--hover)}.tbar .tb .ico{width:17px;height:17px}
.tbar .sep{width:1px;height:22px;background:var(--stroke);margin:0 6px;flex:none}
.tbar select{font-size:12.5px;padding:5px;border:1px solid var(--stroke);border-radius:5px;background:var(--card);color:var(--txt)}
.statusbar{height:26px;flex:none;border-top:1px solid var(--stroke);background:var(--wbg2);display:flex;align-items:center;gap:20px;padding:0 14px;font-size:11.5px;color:var(--txt2)}
.ex-bc{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--stroke);border-radius:5px;padding:4px 10px;margin:4px 10px;flex:1}
.ex-bc button{font-size:12.5px;padding:2px 6px;border-radius:4px;white-space:nowrap}.ex-bc button:hover{background:var(--hover)}
.win-body>*{min-height:0}
.ex-main{flex:1;min-height:0;display:flex;overflow:hidden}
.ex-side{width:170px;flex:none;border-right:1px solid var(--stroke);overflow-y:auto;padding:8px 6px;background:var(--wbg2)}
.ex-si{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;font-size:13px;width:100%;text-align:left;position:relative}
.ex-si:hover{background:var(--hover)}.ex-si.on{background:var(--hover)}
.ex-si.on::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--acc)}
.ex-si .ico{width:18px;height:18px}
.ex-grid{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
.ex-it{width:96px;padding:10px 4px;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.ex-it:hover{background:var(--hover)}
.ex-it.sel{background:rgba(0,103,192,.15);outline:1px solid var(--acc)}
.ex-it .ico{width:44px;height:44px}.ex-it img{width:46px;height:38px;object-fit:cover;border-radius:4px}
.ex-it span{font-size:11.5px;text-align:center;word-break:break-word;max-height:29px;overflow:hidden;line-height:1.25}
.ex-it .lkb{position:absolute;top:4px;left:34px;width:14px;height:14px;color:#8a6d00;background:var(--card);border-radius:3px}
.tb.dis{opacity:.35;pointer-events:none}
.ex-side-h{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px}
.ex-si small{display:block;font-size:10.5px;color:var(--txt2);font-weight:400;line-height:1.1;margin-top:1px}
.ex-crumb{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:5px 12px;flex:1;margin:0 8px;min-width:0;overflow:hidden}
.ex-crumb button{font-size:12.5px;padding:2px 6px;border-radius:4px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ex-crumb button:hover{background:var(--hover)}
.ex-crumb .cs{color:var(--txt2);font-size:11px;flex:none}
.ex-search{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:5px 11px;width:180px;flex:none;color:var(--txt2)}
.ex-search input{border:none;outline:none;background:none;font:inherit;font-size:12.5px;color:var(--txt);width:100%}
.od-strip{display:flex;align-items:center;gap:12px;margin:0 0 10px;background:linear-gradient(90deg,rgba(3,100,184,.10),rgba(40,168,234,.06));border:1px solid var(--stroke);border-radius:8px;padding:9px 14px;font-size:12.5px;flex-wrap:wrap}
.od-strip .ico{width:26px;height:26px;flex:none}
.ex-grouph{width:100%;margin:8px 0 2px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.ex-tiles{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.ex-tile{padding:12px 10px;border-radius:6px;display:flex;align-items:center;gap:11px;text-align:left}
.ex-tile:hover{background:var(--hover)}
.ex-tile.sel{background:rgba(0,103,192,.15);outline:1px solid var(--acc)}
.ex-tile .ico{width:38px;height:38px;flex:none}
.ex-tile b{display:block;font-size:12.5px;font-weight:400}
.ex-tile small{color:var(--txt2);font-size:11px}
.drive-bar{height:5px;border-radius:3px;background:var(--stroke);margin-top:5px;overflow:hidden}
.drive-bar i{display:block;height:100%;background:var(--acc)}
.ex-drv .cap{position:relative}
.odb{position:absolute;right:8px;bottom:8px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--stroke);display:flex;align-items:center;justify-content:center;z-index:2}
.odb svg{width:11px;height:11px}
.odb.cloud svg{width:13px;height:13px;background:none;border-radius:0;box-shadow:none}
.ospin{animation:spin 1.1s linear infinite}
.ex-table{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 12px}
.ex-table table{width:100%;border-collapse:collapse;font-size:12.5px}
.ex-table th{text-align:left;font-weight:400;color:var(--txt2);font-size:11.5px;padding:6px 10px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:var(--wbg);z-index:1}
.ex-table td{padding:6px 10px;border-bottom:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.ex-table tr.row:hover td{background:var(--hover)}
.ex-table tr.row.sel td{background:rgba(0,103,192,.15);outline:1px solid var(--acc)}
.ex-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--txt2)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.word-page{flex:1;overflow:auto;background:#e2e2e2;display:flex;justify-content:center;padding:26px 10px}
.word-doc{width:816px;min-height:1056px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.15);padding:90px 96px;outline:none;font-family:Calibri,sans-serif;font-size:15px;line-height:1.5;color:#111}
.xl-wrap{flex:1;overflow:auto;position:relative;background:var(--wbg)}
.xl-tab{border-collapse:separate;border-spacing:0;table-layout:fixed}
.xl-tab thead th{top:0;height:24px;background:var(--wbg2);border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);font-size:11.5px;font-weight:400;color:var(--txt2);position:sticky;z-index:2}
.xl-tab tbody th{left:0;width:44px;background:var(--wbg2);border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);font-size:11.5px;font-weight:400;color:var(--txt2);position:sticky;z-index:2}
.xl-tab thead th:first-child{left:0;z-index:3}
.xl-tab td{width:100px;height:26px;border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:0 6px;font-size:12.5px;overflow:hidden;white-space:nowrap;background:var(--wbg);cursor:cell}
.xl-sel{position:absolute;border:2px solid var(--acc);pointer-events:none;z-index:1;width:98px;height:24px}
.xl-fx{display:flex;align-items:center;gap:6px;flex:1;margin:0 4px}
.xl-fx b{font-style:italic;font-weight:400;color:var(--txt2);font-family:Georgia,serif}
.xl-fx input{flex:1;border:1px solid var(--stroke);border-radius:4px;padding:5px 8px;font-size:12.5px;background:var(--card);color:var(--txt);outline:none;min-width:0}
.xl-name{width:90px;text-align:center;border:1px solid var(--stroke);border-radius:4px;padding:5px;font-size:12.5px;background:var(--card);flex:none}
.ppt{flex:1;display:flex;overflow:hidden}
.ppt-rail{width:160px;flex:none;border-right:1px solid var(--stroke);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--wbg2)}
.ppt-th{border:2px solid transparent;border-radius:5px;padding:3px;position:relative}
.ppt-th.on{border-color:var(--acc)}
.ppt-th .cv{width:100%;aspect-ratio:16/9;border:1px solid var(--stroke);display:flex;flex-direction:column;justify-content:center;padding:8%;gap:5%;overflow:hidden;background:#fff}
.ppt-th .cv h2{font-size:13px;color:#111}.ppt-th .cv p{font-size:8px;color:#333;white-space:pre-wrap;line-height:1.4}
.ppt-th .x{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.ppt-th.on .x{display:flex}
.ppt-stage{flex:1;display:flex;align-items:center;justify-content:center;background:var(--wbg2);padding:20px;overflow:auto}
.ppt-slide{width:min(880px,100%);aspect-ratio:16/9;box-shadow:0 6px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:56px 72px;gap:18px;background:#fff;outline:none}
.ppt-slide h1{font-size:34px;outline:none;font-family:Calibri,sans-serif;color:#111}

#boot{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;
 background:radial-gradient(120% 90% at 50% 40%,#12233d 0%,#0a1424 46%,#04070d 100%)}
#boot.on{display:flex}
#boot::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 42%,rgba(64,156,255,.16),transparent 70%);pointer-events:none}
.b-logo{position:relative;width:148px;height:148px;animation:bIn .95s cubic-bezier(.18,.85,.25,1.18) both}
.b-tile{position:relative;width:100%;height:100%;border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background:linear-gradient(135deg,#41a2f6 0%,#2f8fe0 38%,#17335c 100%);
 font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:88px;font-weight:800;color:#fff;line-height:1;padding-bottom:6px;
 box-shadow:0 26px 90px rgba(47,143,224,.5),inset 0 2px 14px rgba(255,255,255,.38),inset 0 -8px 24px rgba(6,20,40,.45);
 animation:bGlow 2s ease-in-out .9s infinite alternate,bFloat 2.6s ease-in-out .9s infinite alternate}
.b-tile em{position:absolute;font-style:normal;opacity:.16;font-size:150px;right:-26px;bottom:-52px;font-weight:700;pointer-events:none}
.b-ring{position:absolute;left:50%;top:50%;width:196px;height:196px;margin:-98px 0 0 -98px;border-radius:50%;pointer-events:none;
 border:2px solid transparent;border-top-color:rgba(124,196,239,.9);border-right-color:rgba(124,196,239,.25);animation:spin 1.4s linear infinite}
.b-shine{position:absolute;inset:0;border-radius:36px;overflow:hidden;pointer-events:none}
.b-shine::after{content:"";position:absolute;top:-70%;left:-90%;width:48%;height:240%;transform:rotate(24deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:bShine 2.6s ease-in-out 1.1s infinite}
.b-word{margin-top:46px;font-size:29px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:#e8f1fa;
 animation:bTrack 1.5s cubic-bezier(.2,.8,.3,1) .25s both}
.b-word b{font-weight:700;background:linear-gradient(90deg,#6db6ec 0%,#ffffff 50%,#6db6ec 100%);background-size:200% 100%;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:bSheen 2.8s linear .8s infinite}
.b-sub{margin-top:6px;font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:#7fa3c6;animation:bFade 1s ease .8s both}
.b-status{height:18px;margin-top:30px;font-size:12.5px;letter-spacing:.05em;color:#93b7d8;transition:opacity .22s;animation:bFade .8s ease .6s both}
.b-bar{width:236px;height:3px;border-radius:2px;background:rgba(147,183,216,.16);margin-top:16px;overflow:hidden}
.b-bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#2f8fe0,#7cc4ef);animation:bLoad 3.2s ease-in-out forwards}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bIn{from{transform:scale(.25) rotate(-14deg);opacity:0}60%{filter:brightness(1.5)}}
@keyframes bFloat{to{transform:translateY(-7px)}}
@keyframes bGlow{from{box-shadow:0 26px 90px rgba(47,143,224,.42),inset 0 2px 14px rgba(255,255,255,.38),inset 0 -8px 24px rgba(6,20,40,.45)}
 to{box-shadow:0 34px 120px rgba(84,176,255,.72),inset 0 2px 16px rgba(255,255,255,.55),inset 0 -8px 24px rgba(6,20,40,.45)}}
@keyframes bShine{0%{left:-90%}55%,100%{left:135%}}
@keyframes bTrack{from{letter-spacing:.62em;opacity:0;transform:translateY(6px)}to{letter-spacing:.24em;opacity:1;transform:none}}
@keyframes bSheen{to{background-position:200% 0}}
@keyframes bFade{from{opacity:0}}
@keyframes bLoad{0%{width:0}58%{width:74%}100%{width:100%}}

/* ---------- users / security core ---------- */
function curUser(){return state.users.find(u=>u.id===state.session.uid)||state.users[0]}
let elevated=false;
function isAdmin(){return elevated||!!curUser().admin}
function logEvent(type,msg){state.events.unshift({t:Date.now(),type:type,msg:msg});
 if(state.events.length>400)state.events.length=400;save();}
function avatar(u,size){return el('span',{class:'av',style:`width:${size}px;height:${size}px;background:${u.color};font-size:${Math.round(size*.42)}px`,text:(u.name[0]||'?').toUpperCase()})}
function canRead(node){return aclHas(node,'r')}
function canWrite(node){return aclHas(node,'w')}
function canModify(node){return aclHas(node,'m')}
function aclHas(node,cap,uid){if(isAdmin())return true;const a=node&&node.acl;if(!a)return true;
 const id=uid||curUser().id;if(a.owner===id)return true;
 const hi=['f','m','w','r'],i=hi.indexOf(cap),d=a.d;
 if(d&&hi.slice(0,i+1).some(c=>(d[c]||[]).indexOf('all')>=0||(d[c]||[]).indexOf(id)>=0))return false;
 const order=['r','w','m','f'],j=order.indexOf(cap);
 return order.slice(j).some(c=>(a[c]||[]).indexOf('all')>=0||(a[c]||[]).indexOf(id)>=0);}
function capLevel(acl,uid){const order=['f','m','w','r'];
 let dlv=-1;
 if(acl&&acl.d){for(let i=0;i<4;i++)if((acl.d[order[i]]||[]).indexOf(uid)>=0){dlv=i;break;}}
 for(let i=0;i<4;i++)if((acl[order[i]]||[]).indexOf('all')>=0||(acl[order[i]]||[]).indexOf(uid)>=0)
  return dlv>=0&&dlv<=i?null:order[i];
 return null;}
function denied(node,cap,uid){const a=node&&node.acl;if(!a||isAdmin())return false;
 const id=uid||curUser().id;if(a.owner===id)return false;
 const hi=['f','m','w','r'],i=hi.indexOf(cap),d=a.d;
 return !!(d&&hi.slice(0,i+1).some(c=>(d[c]||[]).indexOf('all')>=0||(d[c]||[]).indexOf(id)>=0));}
function effNodeACL(path){for(let i=(path||[]).length-1;i>=0;i--){const n=fsNode(path.slice(0,i));if(n&&n.acl)return n.acl}return null}
function guardWriteFile(path,ok){const d=fsNode(path.slice(0,-1));const f=d&&d.children[path[path.length-1]];
 if(!f)return ok();
 const eff={t:'f',acl:f.acl||effNodeACL(path)};
 if(canWrite(eff))return ok();
 if(denied(eff,'w'))return toast('Can\'t save — write permission is denied for your account',IC.lock);
 toast(canRead(eff)?'This file is read-only for your account — changes can\'t be saved':'You don\'t have permission to save this file',IC.lock);}

/* ---------- virtual file system ---------- */
const FSL=new Set();const ROOTS=['Desktop','Documents','Downloads','Music','Pictures','Videos'];
const EX_PC='\uE000PC',EX_C='\uE000C';
function fsRoot(){return state.fs[curUser().id]||(state.fs[curUser().id]={})}
function fsShareRoot(owner){return state.fs[owner]||(state.fs[owner]={})}
function fsNode(path){
 if(path&&path[0]==='Shared'&&path[1]){let n={t:'d',children:fsShareRoot(path[1])};
  for(let i=2;i<path.length;i++){const p=path[i];if(!n.children||!n.children[p])return null;n=n.children[p];if(n.t!=='d')return null;}
  return n;}
 let n={t:'d',children:fsRoot()};for(const p of path){if(!n.children||!n.children[p])return null;n=n.children[p];if(n.t!=='d')return null;}return n;}
function fsAdd(path,name,node,cb){
 const d=fsNode(path);if(!d)return null;
 if(!(isAdmin()||canWrite(d))){
  elevate('Create "'+name+'" in '+(path.join(' › ')||'This PC'),()=>fsAdd(path,name,node,cb));
  return null;}
 let nm=name,k=1;
 while(d.children[nm]){const m=name.match(/(\.[^.]*)?$/);nm=name.slice(0,m.index)+' - '+k+(m[0]||'');k++;}
 if(!state.settings.everyoneWrite&&!node.acl)node.acl={owner:curUser().id,r:['all'],w:[curUser().id]};
 d.children[nm]=node;fsChanged();cb&&cb(nm);return nm;}
function fsDelete(path,name,cb,silent){
  const d=fsNode(path);if(!d||!d.children[name])return false;
  if(!(isAdmin()||(canModify(d)&&canModify(d.children[name])))){
   elevate('Delete "'+name+'"',()=>fsDelete(path,name,cb));return false;}
 state.bin.push({name:name,node:d.children[name],from:[...path]});delete d.children[name];
 logEvent('Security','Deleted "'+name+'" (by '+curUser().name+')');
 fsChanged();if(!silent)toast('Moved to Recycle Bin',AI.recycle);cb&&cb();return true;}
function fsChanged(){save();
 (function(){const o=(fsRoot()||{}).OneDrive;if(!o)return;
  fsWalk((n,node)=>{if(node.t==='f'&&!node.od)node.od='busy'},['OneDrive']);})();
 if(typeof nasAutoTick==='function'){try{nasAutoTick()}catch(e){}}
 FSL.forEach(f=>{try{f()}catch(e){}});renderDesktop();renderTaskbar();}
function fsWalk(cb,path=[]){const d=path.length?fsNode(path):{t:'d',children:fsRoot()};if(!d)return;
 for(const n in d.children){const node=d.children[n];cb(n,node,path);if(node.t==='d')fsWalk(cb,[...path,n]);}}
function kindIcon(node,name){return node.t==='d'?AI.explorer:

function printPreview(node){

 if(node.kind==='xls'){const rows=Array.isArray(node.content)?node.content:[];
  return '<table class="perm-t"><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(String(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
 if(node.kind==='ppt'){const slides=Array.isArray(node.content)?node.content:[];
  return '<div style="font-size:14px">'+(slides.map((s,i)=>'<div style="margin-bottom:6px"><b>Slide '+(i+1)+':</b> '+esc(s.t||'(no title)')+(s.b?' — '+esc(s.b):'')+'</div>').join('')||'<i>Empty presentation</i>')+'</div>';}
 if(node.kind==='img'||node.kind==='paint')return '<img src="'+esc(node.src||'')+'" style="max-width:220px;border-radius:6px">';
 if(node.kind==='track')return '<i>Audio track — cannot be printed as paper art.</i>';

/* ---- network shares (folders shared FROM other accounts) ---- */
function sharedWithUser(node,uid){
 if(!node||node.t!=='d'||!node.shared)return false;
 const a=node.acl||{};if(a.owner===uid)return false;
 return ['r','w','m','f'].some(k=>{const ar=a[k]||[];return ar.indexOf('all')>=0||ar.indexOf(uid)>=0});}
function sharedFoldersFor(uid){
 const out=[];
 state.users.forEach(u=>{if(u.id===uid)return;const prof=state.fs[u.id];if(!prof)return;
  (function walk(p,list){for(const n in p){const node=p[n];if(!node)continue;
if(node.t==='d'&&sharedWithUser(node,uid))out.push({ownerId:u.id,ownerName:u.name,name:n,path:[...list,n],node});
    if(node.t==='d'&&node.children)walk(node.children,[...list,n]);}})(prof||{},[]);});
 return out;}

  const err=el('div',{style:'color:#ffd7d7;font-size:12px;min-height:18px'});
  const ok=()=>{const u=state.users.find(x=>x.id===sel.value);
   if((u.pass&&u.pass!==pw.value)||(u.pin&&u.pin!==pw.value)){err.textContent='The password or PIN is incorrect.';return;}
  m.classList.remove('open');

  el('div',{class:'uac-h',html:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg><span>User Account Control</span>'}),

/* ---------- window manager ---------- */
const APPS={};let winSeq=0;const WINS=new Set();let focusedW=null;
function openApp(id,arg){const app=APPS[id];if(!app)return;
 if(id==='controlpanel'&&!isAdmin())return toast('Control Panel requires administrator permission',IC.lock);
 if(app.store&&!state.installed[id]){toast(`Get ${app.name} from Microsoft Store`,AI.store);return openApp('store',{app:id});}
 if(app.single){const ex=[...WINS].find(w=>w.app===id);
  if(ex){if(ex.min)restoreWin(ex);focusWin(ex);app.onArg&&app.onArg(ex,arg);return ex;}}
 return createWindow(app,id,arg);}
function createWindow(app,id,arg){
 const W={id:'w'+(++winSeq),app:id,timers:[],cleanup:[],min:false,maxed:false};
 const e=el('div',{class:'win'});
 const w0=Math.min(app.w||760,innerWidth-30),h0=Math.min(app.h||520,innerHeight-90);
 const n=WINS.size%8;
 e.style.cssText+=`width:${w0}px;height:${h0}px;left:${Math.max(8,Math.min((innerWidth-w0)/2+n*26,innerWidth-w0-8))}px;top:${Math.max(8,Math.min((innerHeight-48-h0)/2+n*22,innerHeight-52-h0))}px`;
 const cap=el('div',{class:'cap'},el('span',{class:'cap-ico',html:app.icon}),
  el('span',{class:'cap-t',text:app.name}),
  el('button',{class:'capbtn',html:`<span class="ico">${IC.min}</span>`,onclick:()=>minWin(W)}),
  el('button',{class:'capbtn mx',html:`<span class="ico">${IC.max}</span>`,onclick:()=>toggleMax(W)}),
  el('button',{class:'capbtn close',html:`<span class="ico">${IC.close}</span>`,onclick:()=>closeWin(W)}));
 const body=el('div',{class:'win-body'});
 e.append(cap,body,el('div',{class:'rz-e'}),el('div',{class:'rz-s'}),el('div',{class:'rz-se'}));
 $('#winlayer').append(e);W.e=e;W.body=body;
 W.setTitle=t=>{cap.querySelector('.cap-t').textContent=t};
 W.every=(ms,fn)=>{const h=setInterval(fn,ms);W.timers.push(h);return h};
 W.onClose=fn=>W.cleanup.push(fn);
 e.addEventListener('pointerdown',()=>focusWin(W),true);
 cap.addEventListener('pointerdown',ev=>{if(ev.target.closest('.capbtn'))return;dragWin(W,ev)});
 cap.addEventListener('dblclick',ev=>{if(!ev.target.closest('.capbtn'))toggleMax(W)});
 [['rz-e','x'],['rz-s','y'],['rz-se','xy']].forEach(([cls,dir])=>{
  e.querySelector('.'+cls).addEventListener('pointerdown',ev=>{ev.stopPropagation();focusWin(W);
   const sw=e.offsetWidth,sh=e.offsetHeight,sx=ev.clientX,sy=ev.clientY;
   const mm=m=>{if(dir!=='y')e.style.width=Math.max(330,sw+m.clientX-sx)+'px';
    if(dir!=='x')e.style.height=Math.max(220,sh+m.clientY-sy)+'px';app.onResize&&app.onResize(W)};
   const mu=()=>{removeEventListener('pointermove',mm);removeEventListener('pointerup',mu)};
   addEventListener('pointermove',mm);addEventListener('pointerup',mu);});});
 WINS.add(W);focusWin(W);renderTaskbar();
 try{app.init(W,arg)}catch(err){body.append(el('div',{style:'padding:20px;color:#c42b1c',text:'App error: '+err.message}))}
 return W;}
function closeWin(W){W.cleanup.forEach(f=>{try{f()}catch(e){}});W.timers.forEach(clearInterval);
 W.e.classList.add('closing');setTimeout(()=>W.e.remove(),140);WINS.delete(W);

  setTimeout(()=>{node.od='ok';OD.last=Date.now();save();renderTray();FSL.forEach(f=>{try{f()}catch(e){}})},1600);}
 else if(node.od==='busy')toast('Uploading to OneDrive…',AI.onedrive);

  case 'doc':openApp('word',{node,path:p});break;

/* ---------- password strength + secret (password / PIN) setup ---------- */
function pwStrength(p){
 if(!p)return{sc:0,label:'',col:'var(--stroke)',$:0};
 let sc=0;
 if(p.length>=6)sc++;if(p.length>=10)sc++;
 if(/[a-z]/.test(p)&&/[A-Z]/.test(p))sc++;
 if(/\d/.test(p))sc++;
 if(/[^A-Za-z0-9]/.test(p))sc++;
 const segs=[{l:'Too weak',c:'#c42b1c'},{l:'Weak',c:'#c42b1c'},{l:'Fair',c:'#ca5010'},{l:'Good',c:'#8f7e00'},{l:'Strong',c:'#107c10'}];
 const i=Math.min(sc,4);
 return{sc:i,label:segs[i].l,col:segs[i].c,$:Math.min(sc,4)/4};}
function genPass(){const sets=['abcdefghjkmnpqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789','!@#$%^&*'];
 const pick=s=>s[Math.floor(Math.random()*s.length)];
 let p=sets.map(pick).join('');
 while(p.length<16)p+=pick(sets[Math.floor(Math.random()*sets.length)]);
 return p.split('').sort(()=>Math.random()-.5).join('');}

   row.append(el('th',{text:r+1,style:'width:44px;height:26px'}));
   for(let c=0;c<COLS;c++)row.append(el('td',{'data-r':r,'data-c':c}));
   tb.append(row);}

  const selBox=el('div',{class:'xl-sel'});
  wrap.append(table,selBox);
  const fx=el('input'),nameB=el('div',{class:'xl-name',text:'A1'});
  function cellVal(r,c,seen){
   const raw=G[r][c];
   if(raw===''||raw==null)return'';
   if(typeof raw==='number')return raw;
   if(raw[0]!=='='){const n=parseFloat(raw);return isNaN(n)?raw:n}
   const k=r*100+c;
   if(seen.has(k))return'#CIRC';
   seen.add(k);
   let f=raw.slice(1).toUpperCase().replace(/\s+/g,'');
   f=f.replace(/(SUM|AVG|MIN|MAX|COUNT)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(m,fn,a,b)=>{
    const p=parseRef(a),q=parseRef(b),vs=[];
    if(!p||!q)return'0';
    for(let r2=Math.min(p.r,q.r);r2<=Math.max(p.r,q.r);r2++)
     for(let c2=Math.min(p.c,q.c);c2<=Math.max(p.c,q.c);c2++){
      const v=cellVal(r2,c2,new Set(seen));
      if(typeof v==='number')vs.push(v)}
    if(!vs.length)return'0';
    if(fn==='SUM')return vs.reduce((x2,y2)=>x2+y2,0);
    if(fn==='AVG')return vs.reduce((x2,y2)=>x2+y2,0)/vs.length;
    if(fn==='MIN')return Math.min(...vs);
    if(fn==='MAX')return Math.max(...vs);
    return vs.length});
   f=f.replace(/\b([A-Z]+[0-9]+)\b/g,(m,ref)=>{
    const p=parseRef(ref);
    const v=cellVal(p.r,p.c,new Set(seen));
    return typeof v==='number'?v:'NaN'});
   if(f.indexOf('NaN')>=0)return'#VALUE';
   if(/[^0-9+\-*/().%]/.test(f))return'#ERR';
   try{const v=Function('"use strict";return('+f+')')();
    return(typeof v==='number'&&isFinite(v))?Math.round(v*1e9)/1e9:'#ERR'}
   catch(e){return'#ERR'}}
  function paint(){tb.querySelectorAll('td').forEach(td=>{
    const r=+td.getAttribute('data-r'),c=+td.getAttribute('data-c');
    const v=cellVal(r,c,new Set());
    td.textContent=v===''?'':v;
    td.style.textAlign=typeof v==='number'?'right':'left';});
   placeSel();}
  function placeSel(){
   selBox.style.left=(44+sel.c*100)+'px';selBox.style.top=(24+sel.r*26)+'px';
   nameB.textContent=colN(sel.c)+(sel.r+1);
   if(!edit)fx.value=String(G[sel.r][sel.c]||'');}
  function startEdit(){
   if(edit)return;
   const inp=el('input',{value:G[sel.r][sel.c]||'',
    style:'position:absolute;left:'+(44+sel.c*100)+'px;top:'+(24+sel.r*26)+'px;width:98px;height:24px;border:2px solid var(--acc);padding:0 4px;font-size:12.5px;background:var(--wbg);color:var(--txt);outline:none;z-index:9'});
   wrap.append(inp);inp.focus();inp.select();
   let dead=false;
   const finish=commit=>{if(dead)return;dead=true;inp.remove();edit=null;
    if(commit){G[sel.r][sel.c]=inp.value;paint();}else placeSel();};
   edit={finish:finish};
   inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();finish(true);sel.r=Math.min(ROWS-1,sel.r+1);paint();}
    else if(e.key==='Escape')finish(false);
    else if(e.key==='Tab'){e.preventDefault();finish(true);sel.c=Math.min(COLS-1,sel.c+1);paint();}});
   inp.addEventListener('blur',()=>finish(true));}
  tb.addEventListener('click',e=>{const td=e.target.closest('td');if(!td)return;
   if(edit)edit.finish(true);
   sel={r:+td.getAttribute('data-r'),c:+td.getAttribute('data-c')};placeSel();});
  tb.addEventListener('dblclick',e=>{const td=e.target.closest('td');if(!td)return;
   sel={r:+td.getAttribute('data-r'),c:+td.getAttribute('data-c')};placeSel();startEdit();});
  fx.addEventListener('keydown',e=>{if(e.key==='Enter'){
   G[sel.r][sel.c]=fx.value;sel.r=Math.min(ROWS-1,sel.r+1);paint();}});
  const saveNow=()=>{
   if(filePath){guardWriteFile(filePath,()=>{
     const d=fsNode(filePath.slice(0,-1));const f=d&&d.children[filePath[filePath.length-1]];
     if(!f){filePath=null;return saveNow();}
     f.content=G;fsChanged();toast('Saved',AI.excel)});}
   else ask('Save as','Budget','Workbook name',v=>
    fsAdd(['Documents'],v+'.xlsx',{t:'f',kind:'xls',content:G},nm=>{
     if(nm){filePath=['Documents',nm];pushRecent(nm,'xls',['Documents']);
      W.setTitle(nm+' — Excel');toast('Saved to Documents',AI.excel)}}));};
  W.body.append(el('div',{class:'tbar'},
   el('button',{class:'btn',style:'font-size:12px;padding:5px 10px',text:'Clear',
    onclick:()=>{G=Array.from({length:ROWS},()=>Array(COLS).fill(''));paint()}}),
   el('div',{class:'xl-fx'},nameB,el('b',{text:'fx'}),fx),
   el('button',{class:'btn pri',style:'font-size:12.5px;padding:6px 14px',text:'Save',onclick:saveNow})),

   el('div',{class:'statusbar'},el('span',{text:'Try =SUM(B2:B5) · =AVG(B2:B5) · =MIN/MAX/COUNT · =B2*C2'}),
    el('span',{text:'Double-click a cell to edit'})));
  if(filePath)W.setTitle(filePath[filePath.length-1]+' — Excel');

/* ---------- router / NAS shared helpers ---------- */
function fmtKB(kb){return kb>=1048576?(kb/1048576).toFixed(2)+' GB':kb>=1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB'}
function fileKB(node){if(!node||node.t!=='f')return 0;
 if(node.kind==='track')return 3400;if(node.kind==='img'||node.kind==='paint')return 420;
 const c=node.content,n=typeof c==='string'?c.length:JSON.stringify(c||'').length;
 return Math.max(2,Math.round(n/1024));}
function schedActive(sc,dt){const days=sc.days||[],cur=dt.getHours()*60+dt.getMinutes(),dow=dt.getDay();
 if(sc.start===sc.end)return false;
 if(sc.start<sc.end)return days.includes(dow)&&cur>=sc.start&&cur<sc.end;
 return (days.includes(dow)&&cur>=sc.start)||(days.includes((dow+6)%7)&&cur<sc.end);}
function routerBlockInfo(){const r=state.router;if(!r||!r.clients)return{off:false,block:false,mac:''};
 const pc=r.clients.find(c=>c.type==='pc'),mac=pc?pc.mac:'';
 if(!r.wifiOn)return{off:true,block:true,mac:mac,rule:'Wi-Fi radio is off'};
 const hit=r.sched.find(s=>s.enabled&&s.mac===mac&&schedActive(s,new Date()));
 return{off:false,block:!!hit,mac:mac,rule:hit?hit.name:''};}
function routerWifiBlocked(){const i=routerBlockInfo();return i.off||i.block}
function nasAct(m){state.nas.act.unshift({t:Date.now(),m:m});if(state.nas.act.length>40)state.nas.act.length=40;save();}
function nasSnapshot(folders){const files=[];let kb=0,count=0;
 folders.forEach(f=>{fsWalk((n,node,path)=>{
   const rel=[...path,n];
   if(node.t==='d'){files.push({p:rel.join('/'),k:'dir',kb:0});return}
   const k=fileKB(node);kb+=k;count++;
   const e={p:rel.join('/'),k:node.kind,kb:k};
   if(['txt','doc','xls','ppt'].includes(node.kind)&&k<48)e.c=node.content;
   else if(node.kind==='img'||node.kind==='paint')e.src=node.src;
   else if(node.kind==='track')e.tid=node.tid;
   files.push(e);},[f]);});
 return{t:0,files:files,count:count,kb:Math.round(kb)};}
function folderSig(folders){const parts=[];
 folders.forEach(f=>fsWalk((n,node,path)=>{parts.push([...path,n].join('/')+':'+fileKB(node))},[f]));
 return hashS(parts.join('|'));}
function nasRunTask(t,done,silent){if(t.running)return;
 const snap=nasSnapshot(t.folders);
 t.running=true;t.prog=0;t.sig=folderSig(t.folders);save();
 const iv=setInterval(()=>{t.prog=(t.prog||0)+9+Math.random()*14;
  const bar=document.getElementById('nb-'+t.id);
  if(bar)bar.style.width=Math.min(96,t.prog)+'%';
  if(t.prog>=100){clearInterval(iv);t.running=false;
   snap.t=Date.now();t.history.unshift(snap);if(t.history.length>6)t.history.length=6;
   t.last=snap.t;t.lastCount=snap.count;t.lastKB=snap.kb;
   nasAct('Backup "'+t.name+'" completed — '+snap.count+' items ('+fmtKB(snap.kb)+')');
   logEvent('Application','NAS backup "'+t.name+'" finished ('+snap.count+' files)');
   if(silent)fsChanged();else save(),toast('Backup complete — '+t.name,AI.nas);
   done&&done();}},150);}
function nasAutoTick(){const now=Date.now();
 state.nas.tasks.forEach(t=>{
  if(t.running)return;
  const spans={hourly:36e5,daily:864e5,weekly:6048e5};
  if(spans[t.sched]&&t.last&&now-t.last>=spans[t.sched]){nasAutoQueue.push({t:t,why:t.sched});return}
  if(t.realtime&&t.sig!==null&&t.sig!==folderSig(t.folders)){nasAutoQueue.push({t:t,why:'real-time change'});}});}
const nasAutoQueue=[];
setInterval(()=>{try{
 while(nasAutoQueue.length){const q=nasAutoQueue.shift();
  if(!q.t.running&&(q.t.last===0||Date.now()-q.t.last>1200))
   nasRunTask(q.t,null,true);}
}catch(e){}},2000);

APPS.calculator={name:'Calculator',icon:AI.calculator,w:340,h:480,store:true,single:true,
 init(W){let cur='0',prev=null,op=null,fresh=true;
  const dH=el('div',{class:'calc-h'}),dV=el('div',{class:'calc-v',text:'0'});
  const upd=()=>{dV.textContent=cur;dH.textContent=prev!==null?prev+' '+(op||''):''};
  const calc=()=>{const a=parseFloat(prev),b=parseFloat(cur);
   return op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?(b?a/b:NaN):b};
  const press=k=>{
   if(/^[0-9]$/.test(k)){cur=(fresh||cur==='0')?k:cur+k;fresh=false}
   else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(cur.indexOf('.')<0)cur+='.'}
   else if(['+','−','×','÷'].indexOf(k)>=0){
    if(prev!==null&&op&&!fresh)cur=String(calc());
    prev=cur;op=k;fresh=true}
   else if(k==='='){if(prev!==null&&op){cur=String(calc());prev=null;op=null;fresh=true}}
   else if(k==='C'){cur='0';prev=null;op=null;fresh=true}
   else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}
   else if(k==='±')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;
   else if(k==='√')cur=String(Math.sqrt(parseFloat(cur)));
   else if(k==='%')cur=String(parseFloat(cur)/100);
   upd()};
  const keys=['%','√','C','⌫','7','8','9','÷','4','5','6','×','1','2','3','−','±','0','.','+'];
  const g=el('div',{class:'calc-g'});
  keys.forEach(k=>g.append(el('button',{text:k,onclick:()=>press(k)})));
  g.append(el('button',{class:'eq',text:'=',onclick:()=>press('=')}));
  const kh=e=>{if(focusedW!==W)return;
   const map={Enter:'=','Backspace':'⌫','Escape':'C','+':'+','-':'−','*':'×','/':'÷'};
   if(/^[0-9.]$/.test(e.key))press(e.key);
   else if(map[e.key]){e.preventDefault();press(map[e.key])}};
  document.addEventListener('keydown',kh);
  W.onClose(()=>document.removeEventListener('keydown',kh));
  W.body.append(el('div',{class:'calc'},el('div',{class:'calc-d'},dH,dV),g));
  upd();}};

/* ============ APP: Minesweeper ============ */
APPS.minesweeper={name:'Minesweeper',icon:AI.minesweeper,w:420,h:520,store:true,single:true,
 init(W){const N=9,M=10;
  let cells,mines,open,flag,done,started,start,iv;
  const grid=el('div',{class:'mine-grid',style:'grid-template-columns:repeat('+N+',28px)'});
  const status=el('div',{style:'display:flex;justify-content:space-between;width:100%;font-size:13px;margin-bottom:10px'});
  function reset(){cells=Array(N*N).fill(0);mines=new Set();open=new Set();flag=new Set();
   done=false;started=false;start=Date.now();
   clearInterval(iv);
   iv=setInterval(()=>{if(!done&&status.lastChild)status.lastChild.textContent=Math.floor((Date.now()-start)/1000)+'s'},500);
   draw();}
  function plant(first){let placed=0;
   while(placed<M){const i=Math.floor(Math.random()*N*N);
    if(mines.has(i))continue;
    const fr=(first/N)|0,fc=first%N,ir=(i/N)|0,ic=i%N;
    if(Math.abs(ir-fr)<=1&&Math.abs(ic-fc)<=1)continue;
    mines.add(i);placed++;}
   mines.forEach(i=>{const ir=(i/N)|0,ic=i%N;
    for(let dr=-1;dr<2;dr++)for(let dc=-1;dc<2;dc++){
     const r=ir+dr,c=ic+dc;
     if(r>=0&&r<N&&c>=0&&c<N&&!mines.has(r*N+c))cells[r*N+c]++}});}
  function reveal(i){if(done||open.has(i)||flag.has(i))return;
   open.add(i);
   if(mines.has(i)){done=true;clearInterval(iv);
    mines.forEach(m=>open.add(m));draw();beep(180,1);toast('💥 Boom! Game over');return}
   if(cells[i]===0){const ir=(i/N)|0,ic=i%N;
    for(let dr=-1;dr<2;dr++)for(let dc=-1;dc<2;dc++){
     const r=ir+dr,c=ic+dc;
     if(r>=0&&r<N&&c>=0&&c<N)reveal(r*N+c)}}
   if(open.size===N*N-M){done=true;clearInterval(iv);
    beep(660,2);toast('🏆 Cleared in '+Math.floor((Date.now()-start)/1000)+'s!')}
   draw();}
  function draw(){status.innerHTML='';
   status.append(el('span',{text:'⚑ '+(M-flag.size)}),el('span',{text:'0s'}));
   grid.innerHTML='';
   for(let i=0;i<N*N;i++){
    const c=el('button',{class:'mcell'+(open.has(i)?' open':'')+(flag.has(i)?' flag':'')});
    if(open.has(i)){
     if(mines.has(i)){c.style.background='#c42b1c';c.textContent='●'}
     else if(cells[i]){c.textContent=cells[i];
      c.style.color=['','#1967d2','#388e3c','#d32f2f','#7b1fa2','#c2185b','#0097a7','#000','#616161'][cells[i]]}}
    else if(flag.has(i))c.textContent='⚑';
    c.onclick=()=>{if(!started){started=true;plant(i)}reveal(i)};
    c.oncontextmenu=e=>{e.preventDefault();if(open.has(i)||done)return;
     flag.has(i)?flag.delete(i):flag.add(i);draw()};
    grid.append(c);}}
  W.onClose(()=>clearInterval(iv));
  W.body.append(el('div',{style:'flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center'},
   status,
   el('button',{class:'btn pri',style:'margin-bottom:10px',text:'🙂 New game',onclick:reset}),
   grid));
  reset();}};

APPS.snake={name:'Snake',icon:AI.snake,w:480,h:560,store:true,single:true,
 init(W){const G=20;
  const cv=el('canvas',{width:400,height:400,style:'background:#0d2117;border-radius:8px'});
  const x=cv.getContext('2d');
  let snake,dir,ndir,food,score,iv,dead;
  const scoreE=el('div',{style:'font-size:15px;color:#39d353;font-weight:600'});
  const hiE=el('div',{style:'font-size:13px;color:#7a8b7f'});
  function spawn(){do{food=[Math.floor(Math.random()*G),Math.floor(Math.random()*G)]}
   while(snake.some(s=>s[0]===food[0]&&s[1]===food[1]))}
  function reset(){snake=[[10,10],[9,10],[8,10]];dir=[1,0];ndir=dir;score=0;dead=false;
   spawn();scoreE.textContent='Score: 0';
   hiE.textContent='Best: '+(state.snakeHi||0);
   clearInterval(iv);iv=setInterval(step,Math.max(70,150-score*2));draw();}
  function step(){dir=ndir;
   const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
   if(h[0]<0||h[0]>=G||h[1]<0||h[1]>=G||snake.some(s=>s[0]===h[0]&&s[1]===h[1])){
    dead=true;clearInterval(iv);
    if(score>(state.snakeHi||0)){state.snakeHi=score;save()}
    draw();return}
   snake.unshift(h);
   if(h[0]===food[0]&&h[1]===food[1]){score++;scoreE.textContent='Score: '+score;spawn();
    clearInterval(iv);iv=setInterval(step,Math.max(70,150-score*2))}
   else snake.pop();
   draw();}
  function draw(){x.clearRect(0,0,400,400);
   x.fillStyle='#ff5f56';x.beginPath();x.arc(food[0]*20+10,food[1]*20+10,7,0,7);x.fill();
   snake.forEach((s,i)=>{x.fillStyle=i===0?'#7ce677':'#39d353';
    x.fillRect(s[0]*20+1.5,s[1]*20+1.5,17,17)});
   if(dead){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,145,400,90);
    x.fillStyle='#fff';x.font='700 26px Segoe UI';x.textAlign='center';
    x.fillText('Game over — '+score,200,185);
    x.font='14px Segoe UI';x.fillText('press Space to restart',200,212)}}
  const kh=e=>{if(focusedW!==W)return;
   const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
   if(m[e.key]){e.preventDefault();
    const nd=m[e.key];
    if(nd[0]!==-dir[0]||nd[1]!==-dir[1])ndir=nd}
   else if(e.key===' '&&dead){e.preventDefault();reset()}};
  document.addEventListener('keydown',kh);
  W.onClose(()=>{document.removeEventListener('keydown',kh);clearInterval(iv)});
  W.body.append(el('div',{style:'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#101418'},
   el('div',{style:'display:flex;gap:20px'},scoreE,hiE),cv,
   el('div',{style:'color:#5a6b5f;font-size:12px',text:'Arrow keys / WASD · Space restarts'})));
  reset();}};

/* ============ APP: Sticky Notes ============ */
APPS.stickynotes={name:'Sticky Notes',icon:AI.stickynotes,w:640,h:480,store:true,single:true,
 init(W){const wrap=el('div',{class:'sticky-b'});
  const colors=['#ffe066','#ffc9c9','#c9f2c9','#c9e4ff','#e4c9ff'];
  function draw(){wrap.innerHTML='';
   if(!state.notes.length)wrap.append(el('div',{style:'color:var(--txt2);padding:10px',text:'No notes — click "+ New note".'}));
   state.notes.forEach(n=>{
    const ta=el('textarea',{placeholder:'Take a note...'});
    ta.value=n.text;
    ta.oninput=()=>{n.text=ta.value;save()};
    wrap.append(el('div',{class:'sticky',style:'background:'+n.color},ta,
     el('button',{class:'sx',style:'right:28px',text:'🎨',title:'Change color',
      onclick:()=>{n.color=colors[(colors.indexOf(n.color)+1)%colors.length];save();draw()}}),
     el('button',{class:'sx',text:'×',title:'Delete',
      onclick:()=>{state.notes=state.notes.filter(q=>q.id!==n.id);save();draw()}})))});}
  W.body.append(el('div',{class:'tbar'},
   el('button',{class:'btn pri',style:'font-size:12.5px;padding:6px 14px',text:'+ New note',
    onclick:()=>{state.notes.push({id:Date.now(),text:'',color:colors[state.notes.length%colors.length]});
     save();draw()}})),wrap);
  draw();}};

/* ============ APP: Terminal ============ */
APPS.terminal={name:'Terminal',icon:AI.terminal,w:740,h:470,store:true,
 init(W){const out=el('div',{class:'term-out'});
  let cwd=[];
  const print=t=>{out.append(el('div',{text:t}));out.scrollTop=out.scrollHeight};
  const prompt=()=>cwd.length?'/'+cwd.join('/'):'~';
   print('Mr.B OSs Terminal [Version 1.0.1]');
  print('Type "help" for commands.\n');
  const inp=el('input',{spellcheck:'false',autocomplete:'off'});
   function run(line){print(curUser().name.toLowerCase().replace(/\s+/g,'')+'@mrb:'+prompt()+' $ '+line);
   const parts=line.trim().split(/\s+/),cmd=parts[0]||'',arg=parts.slice(1).join(' ');
   const d=()=>fsNode(cwd);
   switch(cmd){
    case'':break;
    case'help':print('help dir/ls cd cat/type echo cls whoami users date ver');
      print('tree open ping sudo shutdown exit neofetch');break;
    case'ls':case'dir':{const dd=d();
     if(!dd)print('path not found');
     else{const es=Object.entries(dd.children);
      es.forEach(e=>print((e[1].t==='d'?'<DIR>  ':'       ')+e[0]));
      print('');print(es.length+' item(s)')}break}
    case'cd':{if(!arg||arg==='/'||arg==='~'){cwd=[];break}
     if(arg==='..'){cwd.pop();break}
     if(fsNode([...cwd,arg]))cwd=[...cwd,arg];
     else print('cd: no such directory: '+arg);break}
    case'cat':case'type':{const dd=d();const f=dd&&dd.children[arg];
     if(!f)print('cat: no such file: '+arg);
     else if(f.t==='d')print('cat: is a directory');
     else if(!canRead(f))print('cat: permission denied');
     else print(String(f.content!=null?f.content:(f.src||'(binary)')));break}
    case'echo':print(arg);break;
    case'cls':out.innerHTML='';break;
    case'whoami':print(curUser().name.toLowerCase()+(curUser().admin?' (admin)':''));break;
    case'users':state.users.forEach(u=>print(u.name+(u.admin?' — Administrator':' — Standard')+(u.id===curUser().id?' *':'')));break;
    case'passwd':print('Change passwords in Control Panel → User Accounts.');break;
    case'date':print(nowLocal().toString());break;
     case'ver':print('Mr.B OSs — one HTML file');break;
    case'tree':{const walk=(p,ind)=>{const dd=fsNode(p);if(!dd)return;
      Object.entries(dd.children).forEach(e=>{
       print(ind+e[0]+(e[1].t==='d'?'/':''));
       if(e[1].t==='d')walk([...p,e[0]],ind+'  ')})};
     walk(cwd,'');break}
    case'open':{const key=Object.keys(APPS).find(k=>k===arg||APPS[k].name.toLowerCase()===arg.toLowerCase());
     if(key){openApp(key);print('Launching '+APPS[key].name+'...')}
     else print('open: app not found: '+arg);break}
    case'sudo':{if(curUser().admin)print('You are already an administrator.');
     else elevate('run "'+arg+'" as administrator',()=>print('[sudo] elevated: '+arg));
     break}
    case'ping':{if(!arg){print('usage: ping <host>');break}
      const isLan=arg.indexOf('192.168.0.')===0;
      print('Pinging '+arg+' with 32 bytes of data:');
      for(let i=0;i<4;i++)print(isLan
       ?'Reply from '+arg+': bytes=32 time='+(1+hashS(arg+i)%3)+'ms TTL=64'
       :'Reply from '+(arg||'?')+': bytes=32 time='+(12+hashS(arg)%28)+'ms TTL=118');
      print('');break}
    case'shutdown':shutdown();break;
    case'exit':closeWin(W);break;
     case'neofetch':print('     ▄▄▄▄▄▄▄▄▄      '+curUser().name+'@mrb');
     print('  ▄▄▄█████████████▄▄▄  -------------------------');
      print('  ████             ████  OS: Mr.B OSs');
     print('  ████             ████  Shell: webterm');
     print('     ▀▀▀▀▀▀▀▀▀           User: '+curUser().name+' ('+(curUser().admin?'admin':'standard')+')');
     print('                          Apps: '+Object.keys(APPS).length+' · Audio: WebAudio synth');break;
    default:print(cmd+': command not found (try "help")');}
   print('');}
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){run(inp.value);inp.value=''}});
  W.body.append(el('div',{class:'term'},out,
   el('div',{class:'term-in'},el('span',{text:'$'}),inp)));
  W.body.querySelector('.term').addEventListener('click',()=>inp.focus());
  setTimeout(()=>inp.focus(),50);}};

 state.recent[state.session.uid||state.users[0].id]=arr;}
